<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROWDGUARD AI | Security Clearance Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #111d33 0%, #060a12 90%);
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 36px 32px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }
        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-icon" style="width: 46px; height: 46px; font-size: 1.5rem;">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h2 class="brand-title" style="font-size: 1.4rem;">CROWDGUARD AI</h2>
                    <div class="brand-subtitle">Surveillance & Threat Portal</div>
                </div>
            </div>

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 p-2 mb-3" role="alert" style="font-size: 0.85rem; background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5;">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <div>{{ error }}</div>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.login_page') }}">
                <div class="mb-3">
                    <label class="form-label text-muted" style="font-size: 0.8rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">
                        <i class="fa-solid fa-id-badge me-1"></i> Security Clearance ID / Username
                    </label>
                    <input type="text" name="username" id="username" class="form-control-dark" placeholder="Enter security clearance username" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted" style="font-size: 0.8rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">
                        <i class="fa-solid fa-lock me-1"></i> Passcode
                    </label>
                    <input type="password" name="password" id="password" class="form-control-dark" placeholder="Enter secure passcode" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-2 fw-bold" style="background: linear-gradient(135deg, #2563eb, #0891b2); border: none; box-shadow: var(--glow-primary);">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> ACCESS CONTROL CENTER
                </button>
            </form>
        </div>
    </div>
</body>
</html>
